services:
  etl:
    build:
      context: .
    working_dir: /app
    environment:
      TZ: Asia/Tokyo
      TOKYO_GRID_EMS_OPENAI_API_KEY: ${TOKYO_GRID_EMS_OPENAI_API_KEY:-}
      OPENAI_DAILY_REPORT_MODEL: ${OPENAI_DAILY_REPORT_MODEL:-}
      OPENAI_DAILY_REPORT_LOCALIZATION_MODEL: ${OPENAI_DAILY_REPORT_LOCALIZATION_MODEL:-}
      OPENAI_DAILY_REPORT_TIMEOUT_SECONDS: ${OPENAI_DAILY_REPORT_TIMEOUT_SECONDS:-}
      OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS: ${OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS:-}
      OPENAI_DAILY_REPORT_HTTP_ATTEMPTS: ${OPENAI_DAILY_REPORT_HTTP_ATTEMPTS:-}
      OPENAI_DAILY_REPORT_RETRY_BASE_SECONDS: ${OPENAI_DAILY_REPORT_RETRY_BASE_SECONDS:-}
      OPENAI_DAILY_REPORT_LOCALES: ${OPENAI_DAILY_REPORT_LOCALES:-}
      OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN: ${OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN:-}
      OPENAI_DAILY_REPORT_AUTO_ENABLE: ${OPENAI_DAILY_REPORT_AUTO_ENABLE:-}
      OPENAI_DAILY_REPORT_LATEST_ONLY: ${OPENAI_DAILY_REPORT_LATEST_ONLY:-true}
      TOKYO_GRID_EMS_FORCE_MODEL_TRAIN: ${TOKYO_GRID_EMS_FORCE_MODEL_TRAIN:-}
      TOKYO_GRID_EMS_APPROVE_RECOVERY_PROMOTION: ${TOKYO_GRID_EMS_APPROVE_RECOVERY_PROMOTION:-}
    volumes:
      - ./python:/app/python:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./data/raw:/app/data/raw
      - ./web/public:/app/web/public
    command: >
      sh -lc "unset OPENAI_API_KEY &&
      if [ -n \"$${TOKYO_GRID_EMS_OPENAI_API_KEY}\" ]; then echo '[OPENAI] project report key: set'; else echo '[OPENAI] project report key: missing; fallback report will be used'; fi &&
      export OPENAI_DAILY_REPORT_LATEST_ONLY=$${OPENAI_DAILY_REPORT_LATEST_ONLY:-true} &&
      python python/etl/fetch_tepco.py --overwrite-recent-days 3 &&
      python python/etl/run_batch.py --input data/raw --out web/public"

  intraday-shadow:
    image: tokyo-grid-ems-intraday-shadow:1.0.0
    build:
      context: .
      dockerfile: docker/shadow.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Tokyo
    volumes:
      - type: bind
        source: ./data/intraday_challenger/shadow-deployment
        target: /shadow-input
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: intraday-shadow-data
        target: /app/data/intraday_challenger
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 2.0
    mem_limit: 1g
    stop_grace_period: 210s
    healthcheck:
      test: [CMD, python, -m, python.eval.intraday_challenger.service, health]
      interval: 60s
      timeout: 15s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  intraday-shadow-data:
    name: tokyo-grid-ems-intraday-shadow
