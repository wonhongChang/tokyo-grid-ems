global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: [/etc/tgems/rules.yml]
scrape_configs:
  - job_name: pipeline
    honor_labels: true
    static_configs: [{targets: ["collector:8889"]}]
  - job_name: collector
    static_configs: [{targets: ["collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
