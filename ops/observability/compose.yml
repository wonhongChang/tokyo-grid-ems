name: tgems-observe
x-common: &common
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp:size=32m]
  logging:
    driver: json-file
    options: {max-size: 4m, max-file: "2"}
services:
  collector:
    <<: *common
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/tgems/config.yml"]
    ports: ["127.0.0.1:4318:4318"]
    networks: [ingress, backend]
    mem_limit: 256m
    cpus: 0.5
    volumes: ["./collector.yml:/etc/tgems/config.yml:ro"]
  tempo:
    <<: *common
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tgems/tempo.yml"]
    networks: [backend]
    mem_limit: 1g
    cpus: 1
    volumes: ["./tempo.yml:/etc/tgems/tempo.yml:ro","traces:/var/tempo"]
  prometheus:
    <<: *common
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: ["--config.file=/etc/tgems/prometheus.yml","--storage.tsdb.path=/prometheus","--storage.tsdb.retention.time=30d","--storage.tsdb.retention.size=2GB"]
    networks: [backend]
    mem_limit: 768m
    cpus: 0.5
    volumes: ["./prometheus.yml:/etc/tgems/prometheus.yml:ro","./rules.yml:/etc/tgems/rules.yml:ro","metrics:/prometheus"]
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 4s
  grafana:
    <<: *common
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports: ["127.0.0.1:3300:3000"]
    networks: [ingress, backend]
    mem_limit: 384m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
    secrets: [admin_password]
    volumes: ["grafana:/var/lib/grafana","./grafana/provisioning:/etc/grafana/provisioning:ro","./grafana/dashboards:/var/lib/tgems/dashboards:ro"]
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 4s
networks:
  backend: {internal: true}
  ingress: {}
volumes:
  traces: {}
  metrics: {}
  grafana: {}
secrets:
  admin_password: {file: ./.local/admin_password}
