receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318", max_request_body_size: 1048576}
extensions:
  health_check: {endpoint: "0.0.0.0:13133"}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 192, spike_limit_mib: 48}
  filter/traces:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch(resource.attributes["service.name"], "^tgems-(etl|host|public|fixture)$") or scope.name != "tgems.ops"'
        - 'not IsMatch(span.name, "^(etl[.](batch|intraday|fetch|fetch_historical|local_run)|data[.]restore|restore[.](probe|fetch)|source[.]fetch|input[.](inventory|parse|quality)|weather[.](enrich|fetch)|cache[.]prepare|forecast[.](issue|calibrate|intraday|publish)|features[.]build|model[.](load|predict)|publication[.]freeze|snapshot[.]retain|origin[.]record|publish[.](validate|request)|git[.]publish|workflow[.]dispatch|public[.]observe)$")'
        - 'not IsMatch(span.attributes["outcome"], "^(ok|failed|skipped|degraded|unknown)$") or not IsMatch(span.attributes["reason"], "^(none|execution|timeout|io|permission|invalid)$")'
        - 'Len(span.events) > 0 or Len(span.links) > 0'
        - 'scope.version != "" or scope.schema_url != "" or resource.schema_url != ""'
  transform/traces:
    error_mode: propagate
    trace_statements:
      - 'keep_keys(resource.attributes, ["service.name"])'
      - 'keep_keys(scope.attributes, [])'
      - 'keep_keys(span.attributes, ["outcome","reason"])'
      - 'set(span.status.message, "")'
      - 'set(span.trace_state, "")'
  filter/gauges:
    error_mode: propagate
    metrics:
      metric:
        - 'resource.attributes["service.name"] != "tgems-public" or scope.name != "tgems.ops"'
        - 'not IsMatch(metric.name, "^tgems_(projector_(success|timestamp_seconds)|pages_(success|status_timestamp_seconds|status_timestamp_match|last_success_timestamp_seconds)|public_(artifact_timestamp_seconds|slots)|observed_slot_timestamp_seconds|quality_(available|samples|mae_mw|rmse_mw|wape_ratio|band_(mae|bias)_mw|(report|target)_timestamp_seconds))$")'
        - 'metric.type != METRIC_DATA_TYPE_GAUGE'
        - 'scope.version != "" or scope.schema_url != "" or resource.schema_url != "" or metric.unit != "" or metric.description != ""'
      datapoint:
        - 'Len(datapoint.exemplars) > 0'
        - 'datapoint.attributes["kind"] != nil and not IsMatch(datapoint.attributes["kind"], "^(observed|fallback)$")'
        - 'datapoint.attributes["basis"] != nil and datapoint.attributes["basis"] != "published"'
        - 'datapoint.attributes["window"] != nil and datapoint.attributes["window"] != "day"'
        - 'datapoint.attributes["band"] != nil and not IsMatch(datapoint.attributes["band"], "^(overnight|morning_ramp|daytime|late_afternoon|evening)$")'
  transform/gauges:
    error_mode: propagate
    metric_statements:
      - 'keep_keys(resource.attributes, ["service.name"])'
      - 'keep_keys(scope.attributes, [])'
      - 'keep_keys(datapoint.attributes, ["kind","basis","window","band"])'
  batch: {timeout: 1s, send_batch_size: 128, send_batch_max_size: 256}
  filter/business:
    error_mode: propagate
    traces:
      span: ['resource.attributes["service.name"] == "tgems-fixture"']
connectors:
  span_metrics:
    namespace: tgems.stage
    dimensions: [{name: outcome}, {name: reason}]
    exclude_dimensions: [collector.instance.id, span.kind, status.code]
    histogram:
      unit: s
      explicit: {buckets: [5ms, 50ms, 500ms, 5s, 60s, 300s]}
    metrics_flush_interval: 5s
    metrics_expiration: 24h
    aggregation_cardinality_limit: 256
    resource_metrics_key_attributes: [service.name]
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    sending_queue: {enabled: true, queue_size: 128}
    retry_on_failure: {enabled: true, max_elapsed_time: 30s}
  prometheus:
    endpoint: "0.0.0.0:8889"
    metric_expiration: 3m
    resource_to_telemetry_conversion: {enabled: false}
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: "0.0.0.0", port: 8888}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, filter/traces, transform/traces, batch], exporters: [otlp/tempo]}
    traces/business: {receivers: [otlp], processors: [memory_limiter, filter/traces, transform/traces, filter/business], exporters: [span_metrics]}
    metrics/projector: {receivers: [otlp], processors: [memory_limiter, filter/gauges, transform/gauges, batch], exporters: [prometheus]}
    metrics/stages: {receivers: [span_metrics], exporters: [prometheus]}
