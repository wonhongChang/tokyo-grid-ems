name: Manual ETL + Deploy

on:
  workflow_dispatch:
    inputs:
      force_historical_etl:
        description: 'Fetch TEPCO ZIP and rerun historical ETL even if yesterday is already finalized'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  statuses: write
  id-token: write

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  etl-and-deploy:
    outputs:
      releasable: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    env:
      TOKYO_GRID_EMS_D1_TRIAL: ${{ vars.TOKYO_GRID_EMS_D1_TRIAL }}
      TOKYO_GRID_EMS_D1_WRITER: github-manual-etl
      TGEMS_H1_ISSUE: ${{ vars.TGEMS_H1_ISSUE == '0' && '0' || '1' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      # ── Python setup ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Restore web/public from data branch ───────────────────────────────
      - name: Restore web/public from data branch
        run: |
          git fetch --no-tags origin +refs/heads/data:refs/remotes/origin/data
          echo "RESTORED_DATA_SHA=$(git rev-parse origin/data)" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git worktree add --detach /tmp/data-wt "$(git rev-parse origin/data)"
            python scripts/public_artifact_security.py restore /tmp/data-wt --worktree
            mkdir -p web/public
            rsync -a --exclude='.git' /tmp/data-wt/ web/public/
            python scripts/public_artifact_security.py data web/public
            git worktree remove /tmp/data-wt --force
          else
            echo "[INFO] No data branch yet — starting fresh"
          fi

      - name: Check prior D-1 publication for an opted-in target
        run: python scripts/prepare_d1_receipt.py || echo "::warning::No new D-1 receipt; incumbent without proof"

      # ── Fetch TEPCO data ──────────────────────────────────────────────────
      - name: Check historical ETL necessity
        id: historical_etl
        env:
          FORCE_HISTORICAL_ETL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_historical_etl || false }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          force = str(os.getenv("FORCE_HISTORICAL_ETL", "false")).lower() == "true"
          yesterday = (datetime.now(ZoneInfo("Asia/Tokyo")).date() - timedelta(days=1)).isoformat()
          public_dir = Path("web/public")
          state_path = public_dir / ".etl_state.json"
          actual_path = public_dir / "actual" / f"{yesterday}.json"
          needed = True
          reason = "missing_state_or_actual"

          if force:
              reason = "manual_force"
          else:
              try:
                  state = json.loads(state_path.read_text(encoding="utf-8"))
              except (FileNotFoundError, json.JSONDecodeError):
                  state = {}

              ok_dates = set(state.get("okDates") or [])
              if yesterday not in ok_dates:
                  reason = "yesterday_not_in_ok_dates"
              elif not actual_path.exists():
                  reason = "yesterday_actual_json_missing"
              else:
                  try:
                      actual = json.loads(actual_path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError:
                      actual = {}
                  observed_hours = set()
                  for point in actual.get("series") or []:
                      if point.get("actualMw") is None:
                          continue
                      if point.get("actualSource") == "tepco_forecast_fallback":
                          continue
                      ts = str(point.get("ts") or "")
                      if not ts.startswith(yesterday):
                          continue
                      try:
                          observed_hours.add(int(ts[11:13]))
                      except (ValueError, IndexError):
                          continue
                  if len(observed_hours) >= 24:
                      needed = False
                      reason = "yesterday_already_finalized"
                  else:
                      reason = f"only_{len(observed_hours)}_observed_hours"

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"needed={str(needed).lower()}\n")
              fh.write(f"yesterday={yesterday}\n")
              fh.write(f"reason={reason}\n")
          print(f"[ETL-CHECK] yesterday={yesterday} needed={needed} reason={reason}")
          PY

      - name: Fetch TEPCO CSVs
        if: steps.historical_etl.outputs.needed == 'true'
        run: python python/etl/fetch_tepco.py

      # ── ETL ───────────────────────────────────────────────────────────────
      - name: Run ETL
        if: steps.historical_etl.outputs.needed == 'true'
        run: python python/etl/run_batch.py
        env:
          TOKYO_GRID_EMS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DAILY_REPORT_MODEL: ${{ vars.OPENAI_DAILY_REPORT_MODEL }}
          OPENAI_DAILY_REPORT_LOCALIZATION_MODEL: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_MODEL }}
          OPENAI_DAILY_REPORT_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALES: ${{ vars.OPENAI_DAILY_REPORT_LOCALES }}
          OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN: ${{ vars.OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN }}
          OPENAI_DAILY_REPORT_LATEST_ONLY: ${{ vars.OPENAI_DAILY_REPORT_LATEST_ONLY }}

      - name: Refresh intraday actuals, forecasts, and status
        run: python python/etl/run_batch.py --status-only
        env:
          TOKYO_GRID_EMS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DAILY_REPORT_MODEL: ${{ vars.OPENAI_DAILY_REPORT_MODEL }}
          OPENAI_DAILY_REPORT_LOCALIZATION_MODEL: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_MODEL }}
          OPENAI_DAILY_REPORT_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALES: ${{ vars.OPENAI_DAILY_REPORT_LOCALES }}
          OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN: ${{ vars.OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN }}
          OPENAI_DAILY_REPORT_LATEST_ONLY: ${{ vars.OPENAI_DAILY_REPORT_LATEST_ONLY }}

      # ── Push web/public to data branch ────────────────────────────────────
      - name: Preserve confirmed next-hour issue receipts
        if: vars.TGEMS_PAGES_RECOVERY == '1'
        run: python scripts/pages_release.py remember-hourly "$RESTORED_DATA_SHA"

      - name: Push web/public to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/pages_release.py fence "$RESTORED_DATA_SHA"
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git worktree add --detach /tmp/data-wt "$RESTORED_DATA_SHA"
          else
            exit 1  # Never resurrect a missing branch from stale inputs.
          fi
          python scripts/public_artifact_security.py data web/public
          rsync -a --delete --exclude='.git' web/public/ /tmp/data-wt/
          python scripts/hourly_delivery.py /tmp/data-wt
          python scripts/public_artifact_security.py data /tmp/data-wt --worktree
          cd /tmp/data-wt
          git add -A
          committed=false
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "chore: ETL $(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M JST')"
            committed=true
          }
          if ! git diff --staged --quiet; then
            echo "[ERROR] staged changes remained after commit"
            exit 1
          fi
          if [ "$committed" = true ]; then
            test "$(git rev-parse HEAD^)" = "$RESTORED_DATA_SHA"
            for attempt in 1 2 3; do
              if git push "--force-with-lease=refs/heads/data:$RESTORED_DATA_SHA" origin HEAD:refs/heads/data; then
                break
              fi
              upstream=$(git ls-remote --exit-code origin refs/heads/data | cut -f1)
              if [ "$upstream" = "$(git rev-parse HEAD)" ]; then break; fi
              test "$upstream" = "$RESTORED_DATA_SHA" || exit 1
              if [ "$attempt" -eq 3 ]; then
                echo "[ERROR] data branch push failed after $attempt attempts"
                exit 1
              fi
              echo "[WARN] data branch push failed; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          fi
          echo "PUBLISHED_DATA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd -
          git worktree remove /tmp/data-wt --force

      # ── Build Vite app ────────────────────────────────────────────────────
      - name: Check exact successful Pages revision
        id: identity
        if: vars.TGEMS_PAGES_RECOVERY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages_release.py check-current "$PUBLISHED_DATA_SHA"
      - uses: actions/setup-node@v6
        if: steps.identity.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        if: steps.identity.outputs.skip != 'true'
        run: npm ci
        working-directory: web

      - name: Build
        if: steps.identity.outputs.skip != 'true'
        # Fail before Vite copies anything through a link in its public tree.
        run: |
          python ../scripts/public_artifact_security.py data public
          npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # ── Deploy to GitHub Pages ────────────────────────────────────────────
      - name: Check Pages release and exclude ETL-only binary state
        if: steps.identity.outputs.skip != 'true'
        id: release
        run: |
          python scripts/pages_release.py fence "$PUBLISHED_DATA_SHA"
          python scripts/pages_release.py stamp "$PUBLISHED_DATA_SHA"
          python scripts/public_artifact_security.py pages web/dist
          echo "sha=$PUBLISHED_DATA_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: steps.identity.outputs.skip != 'true'
        id: pages-artifact
        with:
          path: web/dist
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact visibility
        if: steps.identity.outputs.skip != 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 .github/scripts/wait_for_pages_artifact.py
          python scripts/pages_release.py fence-release "$PUBLISHED_DATA_SHA"

      - uses: actions/deploy-pages@v5
        if: steps.identity.outputs.skip != 'true'
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Record successful data and code revision
        if: steps.deploy.outcome == 'success' && vars.TGEMS_PAGES_RECOVERY == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages_release.py ack "$PUBLISHED_DATA_SHA"

  recover:
    needs: etl-and-deploy
    if: failure() && needs.etl-and-deploy.result == 'failure' && needs.etl-and-deploy.outputs.releasable != '' && vars.TGEMS_PAGES_RECOVERY == '1' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages-recovery.yml
    with:
      failed_data_sha: ${{ needs.etl-and-deploy.outputs.releasable }}
