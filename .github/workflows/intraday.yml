name: Intraday Update

on:
  schedule:
    # Midnight rollover (JST 00:10) so the dashboard switches dates before the first intraday refresh.
    - cron: '10 15 * * *'
    # Every 2 hours after TEPCO's hourly refresh has settled.
    # Morning 07:30/08:30/09:30 JST are handled by the local Docker ETL
    # scheduler to avoid duplicate historical ETL and Pages deployments.
    # JST: 01:20, 03:20, 05:20, 11:20, 13:20, 15:20, 17:20, 19:20, 21:20
    - cron: '20 2-12/2 * * *'
    - cron: '20 16-20/2 * * *'
    # Morning ramp refreshes. Together with local ETL at 07:30/08:30/09:30 JST,
    # this gives hourly coverage from 06:20 through 11:20 JST.
    # JST: 06:20, 10:20
    - cron: '20 21 * * *'
    - cron: '20 1 * * *'
    # Late-day catch-up after TEPCO has more time to publish the 22:00 bucket.
    # The 23:00 bucket may still be unavailable; the ETL marks it as TEPCO forecast fallback.
    # JST: 23:50
    - cron: '50 14 * * *'
    # Catch-up for the important late-morning refresh if the 11:20 JST scheduled run is delayed or dropped.
    # JST: 12:05
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  statuses: write
  id-token: write

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  update-today:
    outputs:
      releasable: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    env:
      TOKYO_GRID_EMS_D1_TRIAL: ${{ vars.TOKYO_GRID_EMS_D1_TRIAL }}
      TOKYO_GRID_EMS_D1_WRITER: github-intraday
      TGEMS_H1_REGULAR: '1'
      TGEMS_H1_SETTING_JSON: ${{ toJSON(vars.TGEMS_H1_ISSUE) }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Restore web/public from data branch ───────────────────────────────
      - name: Restore web/public from data branch
        run: |
          git fetch --no-tags origin +refs/heads/data:refs/remotes/origin/data
          echo "RESTORED_DATA_SHA=$(git rev-parse origin/data)" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git worktree add --detach /tmp/data-wt "$(git rev-parse origin/data)"
            python scripts/public_artifact_security.py restore /tmp/data-wt --worktree
            mkdir -p web/public
            rsync -a --exclude='.git' /tmp/data-wt/ web/public/
            python scripts/public_artifact_security.py data web/public
            git worktree remove /tmp/data-wt --force
          else
            echo "[INFO] No data branch yet"
          fi

      - name: Check prior D-1 publication for an opted-in target
        run: |
          python scripts/prepare_d1_receipt.py || echo "::warning::D-1 proof unavailable; forecast stays on incumbent without valid proof"

      - name: Update intraday actuals, forecasts, and status
        run: python python/etl/run_batch.py --status-only
        env:
          TOKYO_GRID_EMS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DAILY_REPORT_MODEL: ${{ vars.OPENAI_DAILY_REPORT_MODEL }}
          OPENAI_DAILY_REPORT_LOCALIZATION_MODEL: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_MODEL }}
          OPENAI_DAILY_REPORT_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS: ${{ vars.OPENAI_DAILY_REPORT_LOCALIZATION_TIMEOUT_SECONDS }}
          OPENAI_DAILY_REPORT_LOCALES: ${{ vars.OPENAI_DAILY_REPORT_LOCALES }}
          OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN: ${{ vars.OPENAI_DAILY_REPORT_MAX_CALLS_PER_RUN }}
          OPENAI_DAILY_REPORT_LATEST_ONLY: ${{ vars.OPENAI_DAILY_REPORT_LATEST_ONLY }}

      # ── Push web/public to data branch ────────────────────────────────────
      - name: Preserve confirmed next-hour issue receipts
        if: vars.TGEMS_PAGES_RECOVERY == '1'
        run: python scripts/pages_release.py remember-hourly "$RESTORED_DATA_SHA"

      - name: Push web/public to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/pages_release.py fence "$RESTORED_DATA_SHA"
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git worktree add --detach /tmp/data-wt "$RESTORED_DATA_SHA"
          else
            exit 1  # Never resurrect a missing branch from stale inputs.
          fi
          python scripts/public_artifact_security.py data web/public
          rsync -a --delete --exclude='.git' web/public/ /tmp/data-wt/
          python scripts/hourly_delivery.py /tmp/data-wt
          python scripts/public_artifact_security.py data /tmp/data-wt --worktree
          cd /tmp/data-wt
          git add -A
          committed=false
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "chore: intraday $(TZ=Asia/Tokyo date '+%H:%M JST')"
            committed=true
          }
          if ! git diff --staged --quiet; then
            echo "[ERROR] staged changes remained after commit"
            exit 1
          fi
          if [ "$committed" = true ]; then
            test "$(git rev-parse HEAD^)" = "$RESTORED_DATA_SHA"
            for attempt in 1 2 3; do
              if git push "--force-with-lease=refs/heads/data:$RESTORED_DATA_SHA" origin HEAD:refs/heads/data; then
                break
              fi
              upstream=$(git ls-remote --exit-code origin refs/heads/data | cut -f1)
              if [ "$upstream" = "$(git rev-parse HEAD)" ]; then break; fi
              test "$upstream" = "$RESTORED_DATA_SHA" || exit 1
              if [ "$attempt" -eq 3 ]; then
                echo "[ERROR] data branch push failed after $attempt attempts"
                exit 1
              fi
              echo "[WARN] data branch push failed; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
          fi
          echo "PUBLISHED_DATA_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd -
          git worktree remove /tmp/data-wt --force

      - name: Check exact successful Pages revision
        id: identity
        if: vars.TGEMS_PAGES_RECOVERY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages_release.py check-current "$PUBLISHED_DATA_SHA"
      - uses: actions/setup-node@v6
        if: steps.identity.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        if: steps.identity.outputs.skip != 'true'
        run: npm ci
        working-directory: web

      - name: Build
        if: steps.identity.outputs.skip != 'true'
        # Fail before Vite copies anything through a link in its public tree.
        run: |
          python ../scripts/public_artifact_security.py data public
          npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check Pages release and exclude ETL-only binary state
        if: steps.identity.outputs.skip != 'true'
        id: release
        run: |
          python scripts/pages_release.py fence "$PUBLISHED_DATA_SHA"
          python scripts/pages_release.py stamp "$PUBLISHED_DATA_SHA"
          python scripts/public_artifact_security.py pages web/dist
          echo "sha=$PUBLISHED_DATA_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        if: steps.identity.outputs.skip != 'true'
        id: pages-artifact
        with:
          path: web/dist
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact visibility
        if: steps.identity.outputs.skip != 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 .github/scripts/wait_for_pages_artifact.py
          python scripts/pages_release.py fence-release "$PUBLISHED_DATA_SHA"

      - uses: actions/deploy-pages@v5
        if: steps.identity.outputs.skip != 'true'
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Record successful data and code revision
        if: steps.deploy.outcome == 'success' && vars.TGEMS_PAGES_RECOVERY == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages_release.py ack "$PUBLISHED_DATA_SHA"

  recover:
    needs: update-today
    if: failure() && needs.update-today.result == 'failure' && needs.update-today.outputs.releasable != '' && vars.TGEMS_PAGES_RECOVERY == '1' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages-recovery.yml
    with:
      failed_data_sha: ${{ needs.update-today.outputs.releasable }}
