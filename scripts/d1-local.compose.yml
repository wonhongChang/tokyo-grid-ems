services:
  etl:
    environment:
      TOKYO_GRID_EMS_D1_WRITER: windows-etl
      TGEMS_H1_REGULAR: '1'
      TGEMS_H1_ISSUE: ${TGEMS_H1_ISSUE-1}
    volumes:
      - type: bind
        source: ${D1_RELEASE_ROOT:?missing release}/python/etl/run_batch.py
        target: /app/python/etl/run_batch.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${D1_RELEASE_ROOT:?missing release}/python/forecast
        target: /app/python/forecast
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${D1_RELEASE_ROOT:?missing release}/python/eval/luna_brief
        target: /app/python/eval/luna_brief
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${D1_RELEASE_ROOT:?missing release}/scripts/hourly_delivery.py
        target: /app/scripts/hourly_delivery.py
        read_only: true
        bind: {create_host_path: false}
